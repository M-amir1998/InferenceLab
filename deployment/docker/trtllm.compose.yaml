# TensorRT-LLM 1.2.1 (trtllm-serve, PyTorch backend) on a GPU host (NOT part of the CPU demo).
# Download the pinned snapshot first (trtllm-serve has no revision flag):
#   uvx --from huggingface_hub hf download Qwen/Qwen2.5-7B-Instruct --revision a09a35458c702b33eeacc393d103063234e8bc28
# and generate trtllm-extra-options.yaml with:
#   inferencelab backend launch-plan configs/deployments/trtllm_qwen_7b.yaml
services:
  trtllm:
    image: nvcr.io/nvidia/tensorrt-llm/release:1.2.1
    command:
      - trtllm-serve
      - serve
      - /root/.cache/huggingface/hub/models--Qwen--Qwen2.5-7B-Instruct/snapshots/a09a35458c702b33eeacc393d103063234e8bc28
      - --host=0.0.0.0
      - --port=8000
      - --tp_size=1
      - --pp_size=1
      - --max_batch_size=256
      - --max_num_tokens=8192
      - --max_seq_len=8192
      - --kv_cache_free_gpu_memory_fraction=0.85
      - --config=/inferencelab/trtllm-extra-options.yaml
    ports: ["127.0.0.1:8000:8000"]
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    env_file: [~/.inferencelab/env]
    volumes:
      - "~/.cache/huggingface:/root/.cache/huggingface"
      - "./trtllm-config:/inferencelab:ro"
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
