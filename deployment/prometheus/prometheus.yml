# Prometheus scrape configuration for the local Compose stack.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: inferencelab-gateway
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: simulated-engines
    static_configs:
      - targets: ["mock-backend-a:9001", "mock-backend-b:9002"]

