# Prefix caching on vs off for both engines (remote).
name: gpu-prefix-cache
mode: remote
max_runs: 8
matrix:
  deployments:
    - ../deployments/vllm_qwen_7b_bf16.yaml
    - ../deployments/vllm_qwen_7b_bf16_nocache.yaml
    - ../deployments/sglang_qwen_7b_bf16.yaml
    - ../deployments/sglang_qwen_7b_bf16_nocache.yaml
  workloads: [../workloads/shared_prefix.yaml, ../workloads/chat_sessions.yaml]
slo: ../slos/interactive.yaml
models_dir: ../models
max_run_duration_s: 900
