# Long-context study: prefill chunking (vLLM chunk size, SGLang on/off) (remote).
name: gpu-chunked-prefill
mode: remote
max_runs: 8
matrix:
  deployments:
    - ../deployments/vllm_qwen_7b_bf16.yaml
    - ../deployments/vllm_qwen_7b_bf16_chunk2k.yaml
    - ../deployments/sglang_qwen_7b_bf16.yaml
    - ../deployments/sglang_qwen_7b_bf16_nochunk.yaml
  workloads: [../workloads/long_short.yaml]
  concurrency: [8, 32]
slo: ../slos/interactive.yaml
models_dir: ../models
max_run_duration_s: 900
