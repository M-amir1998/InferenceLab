# Short input / long output: generation-heavy (decode-bound) traffic.
name: short_long
description: 128-256 input tokens, 768-1024 output tokens
model: qwen2.5-7b-instruct
num_requests: 256
input_tokens: {kind: uniform, min: 128, max: 256}
output_tokens: {kind: uniform, min: 768, max: 1024}
arrival: {kind: closed_loop, concurrency: 8}
warmup: {requests: 8}
temperature: 0.0
ignore_eos: true
seed: 12
